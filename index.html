<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESEARCH LAB : TOP-DOWN LOOP 60</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #050505;
      color: #d4d4d4;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      max-width: 95vw;
      height: 600px;
      background: #000;
      border: 2px solid #2a303c;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー・タイマーバー */
    #header {
      background: #141820;
      padding: 10px 15px;
      border-bottom: 2px solid #2a303c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    #timer-display {
      font-size: 2rem;
      font-weight: bold;
      color: #ff3333;
      text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
    }

    /* メインゲーム領域 */
    #viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #080a0d;
      overflow: hidden;
    }

    /* 2D 描画キャンバス */
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* UIオーバーレイ（テキストメッセージ） */
    #message-box {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(10, 14, 20, 0.9);
      border: 1px solid #3a4659;
      padding: 12px 15px;
      color: #00ffcc;
      font-size: 0.9rem;
      line-height: 1.4;
      pointer-events: none;
      z-index: 20;
      min-height: 60px;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }

    /* キーパッドUI */
    #keypad-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;
      z-index: 30;
    }

    .hidden {
      display: none !important;
    }

    #keypad-display {
      width: 200px;
      height: 40px;
      background: #111;
      border: 1px solid #ff3333;
      color: #ff3333;
      font-size: 1.5rem;
      text-align: center;
      line-height: 40px;
      letter-spacing: 5px;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
    }

    .key-btn {
      width: 60px;
      height: 50px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .key-btn:hover { background: #333; }

    /* 血飛沫キャンバス（最前面） */
    #blood-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* リトライ画面 */
    #death-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(40, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
      z-index: 110;
    }

    .retry-btn {
      background: #800000;
      color: #fff;
      border: 1px solid #ff3333;
      padding: 15px 30px;
      font-size: 1.1rem;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
    }

    .retry-btn:hover {
      background: #b30000;
    }

    @keyframes shake {
      0% { transform: translate(3px, 3px); }
      20% { transform: translate(-4px, -1px); }
      40% { transform: translate(4px, -3px); }
      60% { transform: translate(-3px, 3px); }
      80% { transform: translate(3px, -2px); }
      100% { transform: translate(0, 0); }
    }

    .shaking {
      animation: shake 0.08s infinite;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="blood-canvas"></canvas>

  <div id="header">
    <div>
      <div style="color: #aaa; font-size: 0.8rem;">CONTAINMENT LAB - TOP DOWN</div>
      <div style="font-size: 0.75rem; color: #666;">移動: [WASD] / [矢印キー] | 調べる: [Space] / 近づく</div>
    </div>
    <div id="timer-display">60.00</div>
  </div>

  <div id="viewport">
    <canvas id="game-canvas"></canvas>

    <div id="message-box">
      [WASD] または 矢印キー で移動して研究室を調べてください。
    </div>

    <!-- 暗号キーパッド -->
    <div id="keypad-overlay" class="hidden">
      <div style="color: #aaa; font-size: 0.9rem;">緊急脱出用コードを入力</div>
      <div id="keypad-display">----</div>
      <div class="keypad-grid">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn" onclick="clearKey()">C</button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn" onclick="submitKey()">OK</button>
      </div>
      <button class="key-btn" style="width: 200px; margin-top: 10px;" onclick="closeKeypad()">離れる</button>
    </div>

    <!-- 死亡画面 -->
    <div id="death-overlay" class="hidden">
      <div style="color: #ff3333; font-size: 1.8rem; text-shadow: 0 0 10px #000;">視界が赤く染まり、動かなくなった……</div>
      <button class="retry-btn" onclick="restartGame()">記憶を保持して再試行（ループ）</button>
    </div>
  </div>
</div>

<script>
  const TOTAL_TIME = 60.0;
  let timeLeft = TOTAL_TIME;
  let isDead = false;
  let isWon = false;
  let loopCount = 1;
  let inputCode = "";

  // 死亡演出用アニメーション変数
  let deathAnimationTimer = 0;
  let corpseAngle = 0; // 倒れる方向
  let corpseLength = 0; // 倒れる体の長さ（アニメーション用）

  // 記憶（周回後も維持）
  let memory = {
    knowsCode: false,
    code: "7402"
  };

  // キャンバス設定
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  const bloodCanvas = document.getElementById('blood-canvas');
  const bloodCtx = bloodCanvas.getContext('2d');

  function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    bloodCanvas.width = bloodCanvas.offsetWidth;
    bloodCanvas.height = bloodCanvas.offsetHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // キー入力状態
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') interact();
  });
  window.addEventListener('keyup', e => keys[e.code] = false);

  // プレイヤーパラメータ
  const player = {
    x: 400,
    y: 300,
    radius: 12,
    speed: 3.5,
    color: '#00ffaa'
  };

  // 研究室のオブジェクト定義
  const objects = [
    { id: 'door', name: '脱出扉', x: 370, y: 30, w: 60, h: 20, color: '#ff3333', interactDist: 40 },
    { id: 'desk', name: '実験デスク', x: 100, y: 120, w: 120, h: 60, color: '#445566', interactDist: 50 },
    { id: 'safe', name: '頑丈な金庫', x: 650, y: 120, w: 50, h: 50, color: '#aa8833', interactDist: 45 },
    { id: 'chemicals', name: '怪しい薬品棚', x: 100, y: 400, w: 80, h: 80, color: '#9933cc', interactDist: 50 }
  ];

  // オーディオ効果
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq, duration) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function setMessage(msg) {
    document.getElementById('message-box').innerText = msg;
  }

  function startGame() {
    timeLeft = TOTAL_TIME;
    isDead = false;
    isWon = false;
    player.x = 400;
    player.y = 400;
    deathAnimationTimer = 0;
    
    bloodCtx.clearRect(0, 0, bloodCanvas.width, bloodCanvas.height);
    document.getElementById('death-overlay').classList.add('hidden');
    document.getElementById('keypad-overlay').classList.add('hidden');
    document.getElementById('game-container').classList.remove('shaking');

    setMessage(`【ループ #${loopCount}】研究室に閉じ込められた。タイマーが動いている…！`);
    
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }

  let lastTime = 0;
  function gameLoop(now) {
    if (isWon) return;

    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (!isDead) {
      // タイマー減算
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        triggerDeath("毒ガス充填による呼吸停止および脳出血");
        return;
      }

      document.getElementById('timer-display').innerText = timeLeft.toFixed(2);
      if (timeLeft < 10) {
        document.getElementById('timer-display').style.color = '#ff0000';
      } else {
        document.getElementById('timer-display').style.color = '#ff3333';
      }

      // 移動処理
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
      }

      let nextX = player.x + dx * player.speed;
      let nextY = player.y + dy * player.speed;

      // 外枠壁とのコリジョン
      nextX = Math.max(30, Math.min(canvas.width - 30, nextX));
      nextY = Math.max(50, Math.min(canvas.height - 30, nextY));

      // オブジェクト衝突回避
      objects.forEach(obj => {
        if (nextX + player.radius > obj.x && nextX - player.radius < obj.x + obj.w &&
            nextY + player.radius > obj.y && nextY - player.radius < obj.y + obj.h) {
          nextX = player.x;
          nextY = player.y;
        }
      });

      player.x = nextX;
      player.y = nextY;
    }

    // 描画
    render();

    if (!isDead) {
      requestAnimationFrame(gameLoop);
    }
  }

  // 描画処理（トップダウン視点）
  function render() {
    ctx.fillStyle = '#0a0d12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 床の格子模様
    ctx.strokeStyle = '#151d28';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // 壁
    ctx.strokeStyle = '#3a4659';
    ctx.lineWidth = 8;
    ctx.strokeRect(10, 30, canvas.width - 20, canvas.height - 40);

    // オブジェクト描画
    objects.forEach(obj => {
      ctx.fillStyle = obj.color;
      ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

      ctx.fillStyle = '#aaa';
      ctx.font = '12px Courier New';
      ctx.fillText(obj.name, obj.x, obj.y - 5);
    });

    // プレイヤー描画（生きていれば円、死んでいれば倒れた体）
    if (!isDead) {
      ctx.shadowBlur = 10;
      ctx.shadowColor = player.color;
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 頭部
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(player.x, player.y - 3, 4, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 倒れた死体（見下ろし描画）
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(corpseAngle);

      // 横たわった胴体（長円形）
      ctx.fillStyle = '#006644';
      ctx.beginPath();
      ctx.ellipse(0, corpseLength / 2, 8, corpseLength / 2 + 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // 頭部（床に接している部分）
      ctx.fillStyle = '#cccccc';
      ctx.beginPath();
      ctx.arc(0, corpseLength + 6, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // 近づいて調査
  function interact() {
    if (isDead || isWon) return;

    let interacted = false;
    objects.forEach(obj => {
      const centerX = obj.x + obj.w / 2;
      const centerY = obj.y + obj.h / 2;
      const dist = Math.hypot(player.x - centerX, player.y - centerY);

      if (dist < obj.interactDist) {
        interacted = true;
        playBeep(440, 0.05);

        if (obj.id === 'door') {
          setMessage("【脱出扉】4桁の電子キーパッドがある。");
          showKeypad();
        } else if (obj.id === 'desk') {
          setMessage("【実験デスク】書類の中に血文字のメモ『コードは壁の金庫の中に…』");
        } else if (obj.id === 'safe') {
          memory.knowsCode = true;
          setMessage("【金庫】ロックを解除して紙片を見つけた！『脱出コード: 7402』（記憶に保存された）");
        } else if (obj.id === 'chemicals') {
          triggerDeath("濃硫酸をかぶってしまい、頭部および身体が溶解");
        }
      }
    });

    if (!interacted) {
      setMessage("ここには特に調べるものはない。");
    }
  }

  function showKeypad() {
    inputCode = "";
    document.getElementById('keypad-display').innerText = memory.knowsCode ? memory.code : "----";
    document.getElementById('keypad-overlay').classList.remove('hidden');
  }

  function closeKeypad() {
    document.getElementById('keypad-overlay').classList.add('hidden');
  }

  function pressKey(num) {
    if (inputCode.length < 4) {
      inputCode += num;
      document.getElementById('keypad-display').innerText = inputCode.padEnd(4, '-');
      playBeep(600, 0.05);
    }
  }

  function clearKey() {
    inputCode = "";
    document.getElementById('keypad-display').innerText = "----";
  }

  function submitKey() {
    if (inputCode === memory.code) {
      closeKeypad();
      isWon = true;
      setMessage("【ロック解除】重い扉が開いた！あなたは60秒のループから脱出した！");
      document.getElementById('timer-display').style.color = '#00ffcc';
    } else {
      playBeep(150, 0.2);
      setMessage("エラー：暗号コードが違います。");
      clearKey();
    }
  }

  // 死亡演出（倒れる＋血飛沫＋頭からの失血）
  function triggerDeath(reason) {
    if (isDead) return;
    isDead = true;

    document.getElementById('game-container').classList.add('shaking');
    setMessage(`【死亡】${reason}`);

    // 倒れる方向（ランダムな角度）
    corpseAngle = Math.random() * Math.PI * 2;
    corpseLength = 0;

    // 頭部（血の発生源）の位置を計算
    const getHeadPos = () => {
      return {
        x: player.x + Math.sin(corpseAngle) * (corpseLength + 6),
        y: player.y - Math.cos(corpseAngle) * (corpseLength + 6)
      };
    };

    // 初期の激しい血飛沫（バースト）
    let particles = [];
    for (let i = 0; i < 150; i++) {
      particles.push({
        x: player.x,
        y: player.y,
        vx: (Math.random() - 0.5) * 28,
        vy: (Math.random() - 0.5) * 28,
        r: Math.random() * 6 + 2,
        color: Math.random() > 0.25 ? '#800000' : '#cc0000'
      });
    }

    // 頭部からジワジワ広がる血溜まり（プール）の半径
    let headBloodRadius = 0;

    let frame = 0;
    function animateDeathSequence() {
      frame++;

      // 主人公が倒れるアニメーション（胴体が伸びて伏せる）
      if (corpseLength < 22) {
        corpseLength += 1.5;
      }

      // 再描画（倒れる姿を毎フレーム更新）
      render();

      // 血飛沫パーティクル
      bloodCtx.fillStyle = 'rgba(10, 0, 0, 0.02)';
      bloodCtx.fillRect(0, 0, bloodCanvas.width, bloodCanvas.height);

      particles.forEach(p => {
        bloodCtx.beginPath();
        bloodCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        bloodCtx.fillStyle = p.color;
        bloodCtx.fill();

        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.92;
        p.vy *= 0.92;
      });

      // 倒れた後、頭部から血が大きく滲み出る描写
      if (frame > 15) {
        const head = getHeadPos();
        headBloodRadius += 0.8;

        // 頭部の血溜まり（グラデーションでリアルにしみ出す表現）
        let bloodGrad = bloodCtx.createRadialGradient(
          head.x, head.y, 1,
          head.x, head.y, Math.min(headBloodRadius, 35)
        );
        bloodGrad.addColorStop(0, '#990000');
        bloodGrad.addColorStop(0.7, '#660000');
        bloodGrad.addColorStop(1, 'rgba(60, 0, 0, 0.2)');

        bloodCtx.fillStyle = bloodGrad;
        bloodCtx.beginPath();
        bloodCtx.arc(head.x, head.y, Math.min(headBloodRadius, 35), 0, Math.PI * 2);
        bloodCtx.fill();

        // 不規則な血の滴り・飛び散り
        if (frame % 4 === 0 && headBloodRadius < 30) {
          bloodCtx.fillStyle = '#800000';
          bloodCtx.beginPath();
          bloodCtx.arc(
            head.x + (Math.random() - 0.5) * headBloodRadius * 1.5,
            head.y + (Math.random() - 0.5) * headBloodRadius * 1.5,
            Math.random() * 4 + 2,
            0, Math.PI * 2
          );
          bloodCtx.fill();
        }
      }

      if (frame < 70) {
        requestAnimationFrame(animateDeathSequence);
      } else {
        document.getElementById('death-overlay').classList.remove('hidden');
      }
    }

    animateDeathSequence();
  }

  function restartGame() {
    loopCount++;
    startGame();
  }

  window.onload = startGame;
</script>
</body>
</html>
