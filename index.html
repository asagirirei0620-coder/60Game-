<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESEARCH LAB : TOP-DOWN LOOP 60</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #050505;
      color: #d4d4d4;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      max-width: 95vw;
      height: 600px;
      background: #000;
      border: 2px solid #2a303c;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー・タイマーバー */
    #header {
      background: #141820;
      padding: 10px 15px;
      border-bottom: 2px solid #2a303c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    #timer-display {
      font-size: 2rem;
      font-weight: bold;
      color: #ff3333;
      text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
    }

    /* メインゲーム領域 */
    #viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #080a0d;
      overflow: hidden;
    }

    /* 2D 描画キャンバス */
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* UIオーバーレイ（テキストメッセージ） */
    #message-box {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(10, 14, 20, 0.9);
      border: 1px solid #3a4659;
      padding: 12px 15px;
      color: #00ffcc;
      font-size: 0.9rem;
      line-height: 1.4;
      pointer-events: none;
      z-index: 20;
      min-height: 60px;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }

    /* キーパッドUI */
    #keypad-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;
      z-index: 30;
    }

    .hidden {
      display: none !important;
    }

    #keypad-display {
      width: 200px;
      height: 40px;
      background: #111;
      border: 1px solid #ff3333;
      color: #ff3333;
      font-size: 1.5rem;
      text-align: center;
      line-height: 40px;
      letter-spacing: 5px;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
    }

    .key-btn {
      width: 60px;
      height: 50px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .key-btn:hover { background: #333; }

    /* 血痕キャンバス（レイヤー） */
    #blood-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* リトライ画面 */
    #death-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
      z-index: 110;
      transition: opacity 1s;
    }

    .retry-btn {
      background: #600000;
      color: #fff;
      border: 1px solid #990000;
      padding: 15px 30px;
      font-size: 1.1rem;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 0 15px rgba(150, 0, 0, 0.4);
    }

    .retry-btn:hover {
      background: #800000;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="blood-canvas"></canvas>

  <div id="header">
    <div>
      <div style="color: #aaa; font-size: 0.8rem;">CONTAINMENT LAB - TOP DOWN</div>
      <div style="font-size: 0.75rem; color: #666;">移動: [WASD] / [矢印キー] | 調べる: [Space] / 近づく</div>
    </div>
    <div id="timer-display">60.00</div>
  </div>

  <div id="viewport">
    <canvas id="game-canvas"></canvas>

    <div id="message-box">
      [WASD] または 矢印キー で移動して研究室を調べてください。
    </div>

    <!-- 暗号キーパッド -->
    <div id="keypad-overlay" class="hidden">
      <div style="color: #aaa; font-size: 0.9rem;">緊急脱出用コードを入力</div>
      <div id="keypad-display">----</div>
      <div class="keypad-grid">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn" onclick="clearKey()">C</button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn" onclick="submitKey()">OK</button>
      </div>
      <button class="key-btn" style="width: 200px; margin-top: 10px;" onclick="closeKeypad()">離れる</button>
    </div>

    <!-- 死亡画面 -->
    <div id="death-overlay" class="hidden">
      <div style="color: #cc2222; font-size: 1.6rem; text-shadow: 0 0 10px #000;">脈拍停止。死亡を確認。</div>
      <button class="retry-btn" onclick="restartGame()">記憶を保持して再試行（ループ）</button>
    </div>
  </div>
</div>

<script>
  const TOTAL_TIME = 60.0;
  let timeLeft = TOTAL_TIME;
  let isDead = false;
  let isWon = false;
  let loopCount = 1;
  let inputCode = "";

  // 死亡アニメーション用ステート
  let fallProgress = 0;   // 倒れ具合（0〜1）
  let corpseAngle = 0;    // 倒れる方向の角度
  let headPos = { x: 0, y: 0 };
  let bloodBlobs = [];    // 不規則な血溜まりのパーツ群

  // 記憶（周回後も維持）
  let memory = {
    knowsCode: false,
    code: "7402"
  };

  // キャンバス設定
  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');
  const bloodCanvas = document.getElementById('blood-canvas');
  const bloodCtx = bloodCanvas.getContext('2d');

  function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    bloodCanvas.width = bloodCanvas.offsetWidth;
    bloodCanvas.height = bloodCanvas.offsetHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // キー入力状態
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') interact();
  });
  window.addEventListener('keyup', e => keys[e.code] = false);

  // プレイヤーパラメータ
  const player = {
    x: 400,
    y: 300,
    radius: 12,
    speed: 3.5,
    color: '#00ffaa'
  };

  // 研究室のオブジェクト定義
  const objects = [
    { id: 'door', name: '脱出扉', x: 370, y: 30, w: 60, h: 20, color: '#ff3333', interactDist: 40 },
    { id: 'desk', name: '実験デスク', x: 100, y: 120, w: 120, h: 60, color: '#445566', interactDist: 50 },
    { id: 'safe', name: '頑丈な金庫', x: 650, y: 120, w: 50, h: 50, color: '#aa8833', interactDist: 45 },
    { id: 'chemicals', name: '怪しい薬品棚', x: 100, y: 400, w: 80, h: 80, color: '#9933cc', interactDist: 50 }
  ];

  // オーディオ効果
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq, duration) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function setMessage(msg) {
    document.getElementById('message-box').innerText = msg;
  }

  function startGame() {
    timeLeft = TOTAL_TIME;
    isDead = false;
    isWon = false;
    player.x = 400;
    player.y = 400;
    fallProgress = 0;
    bloodBlobs = [];
    
    bloodCtx.clearRect(0, 0, bloodCanvas.width, bloodCanvas.height);
    document.getElementById('death-overlay').classList.add('hidden');
    document.getElementById('keypad-overlay').classList.add('hidden');

    setMessage(`【ループ #${loopCount}】研究室に閉じ込められた。タイマーが動いている…！`);
    
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }

  let lastTime = 0;
  function gameLoop(now) {
    if (isWon) return;

    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (!isDead) {
      // タイマー減算
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        triggerDeath("時間切れ：低酸素および頭部血管破裂");
        return;
      }

      document.getElementById('timer-display').innerText = timeLeft.toFixed(2);
      if (timeLeft < 10) {
        document.getElementById('timer-display').style.color = '#ff0000';
      } else {
        document.getElementById('timer-display').style.color = '#ff3333';
      }

      // 移動処理
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

      if (dx !== 0 && dy !== 0) {
        dx *= 0.7071;
        dy *= 0.7071;
      }

      let nextX = player.x + dx * player.speed;
      let nextY = player.y + dy * player.speed;

      nextX = Math.max(30, Math.min(canvas.width - 30, nextX));
      nextY = Math.max(50, Math.min(canvas.height - 30, nextY));

      objects.forEach(obj => {
        if (nextX + player.radius > obj.x && nextX - player.radius < obj.x + obj.w &&
            nextY + player.radius > obj.y && nextY - player.radius < obj.y + obj.h) {
          nextX = player.x;
          nextY = player.y;
        }
      });

      player.x = nextX;
      player.y = nextY;
    }

    render();

    if (!isDead) {
      requestAnimationFrame(gameLoop);
    }
  }

  // 描画処理（トップダウン視点）
  function render() {
    ctx.fillStyle = '#0a0d12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 床の格子模様
    ctx.strokeStyle = '#151d28';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // 壁
    ctx.strokeStyle = '#3a4659';
    ctx.lineWidth = 8;
    ctx.strokeRect(10, 30, canvas.width - 20, canvas.height - 40);

    // オブジェクト描画
    objects.forEach(obj => {
      ctx.fillStyle = obj.color;
      ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

      ctx.fillStyle = '#aaa';
      ctx.font = '12px Courier New';
      ctx.fillText(obj.name, obj.x, obj.y - 5);
    });

    // プレイヤー描画
    if (!isDead) {
      ctx.shadowBlur = 10;
      ctx.shadowColor = player.color;
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 頭部
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(player.x, player.y - 3, 4, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // リアルな「倒れた人体」のトップダウン描画
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(corpseAngle);

      // 段階的な倒れ（イージング）
      let bodyLength = 24 * fallProgress;
      let bodyWidth = 10 - (2 * fallProgress);

      // 脚・下半身
      ctx.fillStyle = '#0a3d2e';
      ctx.beginPath();
      ctx.ellipse(0, bodyLength * 0.2, bodyWidth * 0.8, bodyLength * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // 胴体
      ctx.fillStyle = '#00553d';
      ctx.beginPath();
      ctx.ellipse(0, bodyLength * 0.6, bodyWidth, bodyLength * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();

      // 投げ出された両腕
      ctx.fillStyle = '#004430';
      ctx.beginPath();
      ctx.ellipse(-bodyWidth * 1.1, bodyLength * 0.5, 3, 8, -0.4, 0, Math.PI * 2);
      ctx.ellipse(bodyWidth * 1.1, bodyLength * 0.6, 3, 8, 0.5, 0, Math.PI * 2);
      ctx.fill();

      // 頭部（床についた状態）
      let currentHeadY = bodyLength + 5;
      ctx.fillStyle = '#d0d0d0';
      ctx.beginPath();
      ctx.arc(0, currentHeadY, 6, 0, Math.PI * 2);
      ctx.fill();

      // 頭部の位置をグローバル座標として保持（血液の発生源）
      let rad = corpseAngle;
      headPos = {
        x: player.x + (-currentHeadY * Math.sin(rad)),
        y: player.y + (currentHeadY * Math.cos(rad))
      };

      ctx.restore();
    }
  }

  function interact() {
    if (isDead || isWon) return;

    let interacted = false;
    objects.forEach(obj => {
      const centerX = obj.x + obj.w / 2;
      const centerY = obj.y + obj.h / 2;
      const dist = Math.hypot(player.x - centerX, player.y - centerY);

      if (dist < obj.interactDist) {
        interacted = true;
        playBeep(440, 0.05);

        if (obj.id === 'door') {
          setMessage("【脱出扉】4桁の電子キーパッドがある。");
          showKeypad();
        } else if (obj.id === 'desk') {
          setMessage("【実験デスク】書類の中に血文字のメモ『コードは壁の金庫の中に…』");
        } else if (obj.id === 'safe') {
          memory.knowsCode = true;
          setMessage("【金庫】ロックを解除して紙片を見つけた！『脱出コード: 7402』（記憶に保存された）");
        } else if (obj.id === 'chemicals') {
          triggerDeath("強酸性試薬を被曝。頭部および呼吸器系が損傷");
        }
      }
    });

    if (!interacted) {
      setMessage("ここには特に調べるものはない。");
    }
  }

  function showKeypad() {
    inputCode = "";
    document.getElementById('keypad-display').innerText = memory.knowsCode ? memory.code : "----";
    document.getElementById('keypad-overlay').classList.remove('hidden');
  }

  function closeKeypad() {
    document.getElementById('keypad-overlay').classList.add('hidden');
  }

  function pressKey(num) {
    if (inputCode.length < 4) {
      inputCode += num;
      document.getElementById('keypad-display').innerText = inputCode.padEnd(4, '-');
      playBeep(600, 0.05);
    }
  }

  function clearKey() {
    inputCode = "";
    document.getElementById('keypad-display').innerText = "----";
  }

  function submitKey() {
    if (inputCode === memory.code) {
      closeKeypad();
      isWon = true;
      setMessage("【ロック解除】重い扉が開いた！あなたは60秒のループから脱出した！");
      document.getElementById('timer-display').style.color = '#00ffcc';
    } else {
      playBeep(150, 0.2);
      setMessage("エラー：暗号コードが違います。");
      clearKey();
    }
  }

  // リアルな死亡＆頭部からの流血処理
  function triggerDeath(reason) {
    if (isDead) return;
    isDead = true;

    setMessage(`【死亡】${reason}`);

    // 倒れる方向（ランダム）
    corpseAngle = Math.random() * Math.PI * 2;

    // 不規則なリアルな血溜まり形状（複数の円・水滴の集合体）を生成
    bloodBlobs = [];
    for (let i = 0; i < 18; i++) {
      let angle = Math.random() * Math.PI * 2;
      let dist = Math.random() * 22;
      bloodBlobs.push({
        offsetX: Math.cos(angle) * dist,
        offsetY: Math.sin(angle) * dist,
        maxRadius: Math.random() * 12 + 6,
        currentRadius: 0,
        growthSpeed: Math.random() * 0.15 + 0.05,
        color: Math.random() > 0.3 ? '#4a0000' : '#2b0000' // 酸化したリアルな濃い血の色
      });
    }

    let frame = 0;
    function animateDeath() {
      frame++;

      // 1. 膝から崩れ落ちて横たわる（スローモーション）
      if (fallProgress < 1.0) {
        fallProgress += 0.04;
      }

      render();

      // 2. 頭部が床についた後、頭頂部/側面から血が染み出し、床の目地に沿って広がる
      if (frame > 12) {
        bloodCtx.save();

        // 濃くドロっとした主血溜まり（グラデーション）
        let baseGrad = bloodCtx.createRadialGradient(
          headPos.x, headPos.y, 2,
          headPos.x, headPos.y, Math.min((frame - 12) * 0.6, 28)
        );
        baseGrad.addColorStop(0, '#5a0000');
        baseGrad.addColorStop(0.6, '#380000');
        baseGrad.addColorStop(1, 'rgba(30, 0, 0, 0.8)');

        bloodCtx.fillStyle = baseGrad;
        bloodCtx.beginPath();
        bloodCtx.arc(headPos.x, headPos.y, Math.min((frame - 12) * 0.6, 28), 0, Math.PI * 2);
        bloodCtx.fill();

        // 不規則に周囲へ拡がる血の塊・滲み（流体表現）
        bloodBlobs.forEach(b => {
          if (b.currentRadius < b.maxRadius) {
            b.currentRadius += b.growthSpeed;
          }
          bloodCtx.fillStyle = b.color;
          bloodCtx.beginPath();
          bloodCtx.arc(
            headPos.x + b.offsetX,
            headPos.y + b.offsetY,
            b.currentRadius,
            0, Math.PI * 2
          );
          bloodCtx.fill();
        });

        // 静脈血の光沢（粘度感）
        if (frame > 30) {
          bloodCtx.fillStyle = 'rgba(120, 10, 10, 0.4)';
          bloodCtx.beginPath();
          bloodCtx.arc(headPos.x - 2, headPos.y - 2, 4, 0, Math.PI * 2);
          bloodCtx.fill();
        }

        bloodCtx.restore();
      }

      if (frame < 100) {
        requestAnimationFrame(animateDeath);
      } else {
        document.getElementById('death-overlay').classList.remove('hidden');
      }
    }

    animateDeath();
  }

  function restartGame() {
    loopCount++;
    startGame();
  }

  window.onload = startGame;
</script>
</body>
</html>
